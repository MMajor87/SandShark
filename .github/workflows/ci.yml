name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      skip_build:
        description: Skip building the server binaries
        type: boolean
        required: false
        default: false
      upload_server_build:
        description: Upload the built server binaries for a later job to publish
        type: boolean
        required: false
        default: false

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # a new push to a pull request replaces its unfinished run, every other run gets its own group
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

      # the discord.py compatibility test runs a real discord.py bot against the server
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install discord.py
        run: python -m pip install -r apps/server/src/http/__tests__/fixtures/requirements.txt

      - name: Run tests
        run: bun run test
        env:
          # a missing discord.py fails the run here instead of skipping its test
          REQUIRE_DISCORD_PY: '1'
          SANDSHARK_PYTHON: python

      # inputs are empty on push and pull_request events, so those always build
      - name: Build
        if: ${{ !inputs.skip_build }}
        working-directory: apps/server
        run: bun run build

      # a real install on the runner, which runs systemd: the unit has to start the server and
      # the uninstall has to remove it again
      - name: Check the Linux install script
        if: ${{ !inputs.skip_build }}
        run: shellcheck apps/server/installer/linux/install.sh

      - name: Install the server as a systemd service
        if: ${{ !inputs.skip_build }}
        run: |
          sudo sh apps/server/installer/linux/install.sh --binary apps/server/build/out/sandshark-linux-x64
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4991/healthz && break
            sleep 1
          done
          if ! curl -fsS http://localhost:4991/monitor/status; then
            sudo journalctl -u sandshark --no-pager | tail -n 80
            exit 1
          fi
          systemctl is-active sandshark
          test "$(sudo stat -c '%U %a' /var/lib/sandshark)" = "sandshark 750"
          sudo sh apps/server/installer/linux/install.sh --uninstall --purge
          # a negated command never fails a bash -e step, so these are spelled out
          if systemctl is-active --quiet sandshark; then exit 1; fi
          if id sandshark >/dev/null 2>&1; then exit 1; fi
          test ! -e /etc/systemd/system/sandshark.service
          test ! -e /opt/sandshark
          test ! -e /var/lib/sandshark

      # compiled on every build, so a broken installer script fails here rather than at release
      - name: Install NSIS
        if: ${{ !inputs.skip_build }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      - name: Build Windows server installer
        if: ${{ !inputs.skip_build }}
        working-directory: apps/server
        run: bun run build:windows-installer

      - name: Upload server build
        if: ${{ !inputs.skip_build && inputs.upload_server_build }}
        uses: actions/upload-artifact@v6
        with:
          name: server-build
          path: apps/server/build/out
          if-no-files-found: error
          retention-days: 1
