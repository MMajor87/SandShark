name: SandShark Desktop CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows desktop client
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check shared package
        run: bun run --cwd packages/shared check-types

      - name: Typecheck client
        run: bun run --cwd apps/client check-types

      - name: Typecheck desktop
        run: bun run --cwd apps/desktop check-types

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run package

      - name: Smoke launch unpacked app
        working-directory: apps/desktop
        run: bun run test:packaged-startup

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sandshark-windows-x64-${{ github.sha }}
          path: apps/desktop/release/SandShark-*-Setup-x64.exe
          if-no-files-found: error
