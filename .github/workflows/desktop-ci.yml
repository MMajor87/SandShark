name: SandShark Desktop CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows desktop client
    runs-on: windows-latest
    timeout-minutes: 30
    # a new push to a pull request replaces its unfinished run
    concurrency:
      group: desktop-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for Electron Builder
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify desktop security boundary
        run: bun run --cwd apps/desktop check:security

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run package

      - name: Smoke launch unpacked app
        working-directory: apps/desktop
        # the check itself takes seconds; a leftover app process can otherwise hold the step open for hours
        timeout-minutes: 5
        run: bun run test:packaged-startup

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: sandshark-windows-x64-${{ github.sha }}
          path: apps/desktop/release/SandShark-*-Setup-x64.exe
          if-no-files-found: error
          retention-days: 7
