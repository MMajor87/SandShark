name: Release SandShark Desktop

on:
  push:
    tags:
      - 'sandshark-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SandShark tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Record release revision
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

  repository-ci:
    name: Full repository checks
    needs: resolve-release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-release.outputs.sha }}

  release-windows:
    name: Validate and build Windows release
    needs: [resolve-release, repository-ci]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Setup Node for Electron Builder
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate SandShark tag and package versions
        id: version
        env:
          SANDSHARK_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:SANDSHARK_RELEASE_TAG
          $clientVersion = (Get-Content apps/client/package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version

          if ($clientVersion -ne $desktopVersion) {
            throw "SandShark client version '$clientVersion' does not match desktop version '$desktopVersion'."
          }

          $expectedTag = "sandshark-v$desktopVersion"
          if ($tag -ne $expectedTag) {
            throw "SandShark release tag '$tag' does not match package version '$desktopVersion'. Expected '$expectedTag'."
          }

          "version=$desktopVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify desktop security boundary
        run: bun run --cwd apps/desktop check:security

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run package

      - name: Generate checksums
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Name -like 'SandShark-*-Setup-x64.exe' -or $_.Name -eq 'latest.yml' -or $_.Extension -eq '.blockmap' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content release\SHA256SUMS.txt

      - name: Write release summary
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Copy-Item -LiteralPath RELEASE_NOTES.md -Destination release\RELEASE_NOTES.md
          '${{ needs.resolve-release.outputs.sha }}' | Set-Content release\BUILD_COMMIT.txt

      - name: Publish GitHub release and update metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SandShark ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: apps/desktop/release/RELEASE_NOTES.md
          files: |
            apps/desktop/release/SandShark-*-Setup-x64.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/BUILD_COMMIT.txt
