name: Release SandShark Desktop

on:
  push:
    tags:
      - 'sandshark-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SandShark tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  repository-ci:
    name: Full repository checks
    uses: ./.github/workflows/ci.yml

  release-windows:
    name: Validate and build Windows release
    needs: repository-ci
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate SandShark tag and package versions
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          $clientVersion = (Get-Content apps/client/package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version

          if ($clientVersion -ne $desktopVersion) {
            throw "SandShark client version '$clientVersion' does not match desktop version '$desktopVersion'."
          }

          $expectedTag = "sandshark-v$desktopVersion"
          if ($tag -ne $expectedTag) {
            throw "SandShark release tag '$tag' does not match package version '$desktopVersion'. Expected '$expectedTag'."
          }

          "version=$desktopVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Report code-signing mode
        id: signing
        shell: pwsh
        run: |
          $isSigned = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if ($isSigned) {
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "release_name=SandShark ${{ steps.version.outputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Warning "WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD are not configured. Building an unsigned SandShark installer."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "release_name=SandShark ${{ steps.version.outputs.version }} (unsigned)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run package

      - name: Smoke launch unpacked app
        working-directory: apps/desktop
        run: bun run test:packaged-startup

      - name: Verify installer signature
        if: ${{ steps.signing.outputs.signed == 'true' }}
        working-directory: apps/desktop
        run: bun run verify:signature -- -Path release\SandShark-${{ steps.version.outputs.version }}-Setup-x64.exe

      - name: Generate checksums
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Name -like 'SandShark-*-Setup-x64.exe' -or $_.Name -eq 'latest.yml' -or $_.Extension -eq '.blockmap' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content release\SHA256SUMS.txt

      - name: Write release summary
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            'This SandShark Windows installer is code-signed and signature-verified by the release workflow.' | Set-Content release\RELEASE_NOTES.md
          } else {
            'This SandShark Windows installer is unsigned because code-signing secrets are not configured for this repository yet.' | Set-Content release\RELEASE_NOTES.md
          }

      - name: Publish GitHub release and update metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ steps.signing.outputs.release_name }}
          draft: true
          prerelease: ${{ steps.signing.outputs.prerelease }}
          generate_release_notes: true
          body_path: apps/desktop/release/RELEASE_NOTES.md
          files: |
            apps/desktop/release/SandShark-*-Setup-x64.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
