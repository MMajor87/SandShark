name: Publish Development Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload_server_build: true

  build-and-publish:
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ci built and tested these binaries from the same commit, so they are not rebuilt
      - name: Download server build
        uses: actions/download-artifact@v7
        with:
          name: server-build
          path: apps/server/build/out

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          registry: ghcr.io
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.image.outputs.name }}:dev
          labels: |
            org.opencontainers.image.title=SandShark Server
            org.opencontainers.image.description=SandShark Server (dev)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
