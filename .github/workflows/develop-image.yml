name: Publish Development Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: [ci]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project artifacts
        uses: ./.github/actions/build-sharkord

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          registry: ghcr.io
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.image.outputs.name }}:dev
          labels: |
            org.opencontainers.image.title=SandShark Server
            org.opencontainers.image.description=SandShark Server (dev)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
