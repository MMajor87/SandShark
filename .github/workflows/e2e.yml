name: E2E Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  ci:
    name: Run E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # a new push to a pull request replaces its unfinished run, every other run gets its own group
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-{0}', github.ref) || format('e2e-run-{0}', github.run_id) }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        timeout-minutes: 5
        working-directory: packages/e2e
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run E2E tests
        working-directory: packages/e2e
        run: bun test:e2e

      # passing retries still need their traces preserved so flakes can be diagnosed
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
