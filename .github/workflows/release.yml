name: Release SandShark Server

on:
  push:
    tags:
      - 'sandshark-server-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SandShark server tag to build'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: server-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
      image: ${{ steps.revision.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate server tag and record revision
        id: revision
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version apps/server/package.json)
          [[ "$RELEASE_TAG" =~ ^sandshark-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "sandshark-server-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: resolve-release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-release.outputs.sha }}
      upload_server_build: true

  e2e:
    needs: resolve-release
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.resolve-release.outputs.sha }}

  build-and-publish:
    needs: [resolve-release, ci, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      # ci built and tested these binaries from the same commit, so they are not rebuilt
      - name: Download server build
        uses: actions/download-artifact@v7
        with:
          name: server-build
          path: apps/server/build/out
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate provenance and checksums
        working-directory: apps/server/build/out
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          printf '%s\n' "$RELEASE_SHA" > BUILD_COMMIT.txt
          sha256sum sandshark-* release.json BUILD_COMMIT.txt > SHA256SUMS.txt
      - name: Extract this version's release notes
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: bun packages/scripts/src/latest-release-notes.ts apps/server/RELEASE_NOTES.md "$RUNNER_TEMP/RELEASE_NOTES.md" "$RELEASE_VERSION"
      - name: Publish versioned server image
        uses: ./.github/actions/docker-build-publish
        with:
          registry: ghcr.io
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ needs.resolve-release.outputs.image }}:${{ needs.resolve-release.outputs.version }}
          labels: |
            org.opencontainers.image.title=SandShark Server
            org.opencontainers.image.description=Self-hosted SandShark server
            org.opencontainers.image.version=${{ needs.resolve-release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-release.outputs.sha }}
      - name: Create server release draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SandShark Server ${{ needs.resolve-release.outputs.version }}
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: |
            apps/server/build/out/sandshark-linux-x64
            apps/server/build/out/sandshark-linux-arm64
            apps/server/build/out/sandshark-windows-x64.exe
            apps/server/build/out/sandshark-macos-arm64
            apps/server/build/out/release.json
            apps/server/build/out/SHA256SUMS.txt
            apps/server/build/out/BUILD_COMMIT.txt
